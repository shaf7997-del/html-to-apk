version: '3.8'

services:
  apk-builder:
    build: .
    container_name: html-to-apk-server
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - ANDROID_HOME=/opt/android-sdk
      - JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
    volumes:
      # ذخیره موقت پروژه‌ها (اختیاری)
      - build-temp:/app/temp
      # ذخیره keystore برای امضای release (اختیاری)
      # - ./keystores:/app/keystores
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
        reservations:
          memory: 2G
          cpus: '1'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  build-temp:
