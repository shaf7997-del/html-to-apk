# Nginx config برای reverse proxy سرور APK Builder
# مسیر: /etc/nginx/sites-available/ray-studio-apk

server {
    listen 80;
    server_name ray-studio.com;

    # فرانت‌اند (فایل‌های استاتیک)
    location /tools/html-to-apk/ {
        alias /var/www/ray-studio/tools/html-to-apk/;
        try_files $uri $uri/ /tools/html-to-apk/index.html;
        
        # کش فایل‌های استاتیک
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # API سرور بک‌اند
    location /api/build-apk {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        
        # تنظیمات برای فایل‌های بزرگ
        client_max_body_size 50M;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /api/build-aab {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 50M;
        proxy_read_timeout 600s;
    }

    location /api/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # هدرهای امنیتی
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # فشرده‌سازی
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;
}
